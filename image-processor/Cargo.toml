[package]
name = "image-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
rfd = "0.14"
pollster = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawloader = "0.37"
rawler = "0.8.0"
jpgfromraw = { git = "https://github.com/ioma8/jpgfromrawlib", package = "jpgfromraw" }
trash = "5"
kamadak-exif = "0.5"
tract = "0.23"
rayon = "1"
half = "2"

# The system print sheet on macOS is AppKit's, which is Objective-C. Only that
# platform needs these; the CUPS path in `print.rs` covers Linux.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSMutableData comes with the NSData feature -- it is the same class family.
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSImage",
    "NSImageView",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSPrinter",
] }

[patch.crates-io]
block = { path = "vendor/block" }
